<script>
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Style the resume item in the navbar as a pill */
  var resume = document.querySelector('.navbar a.nav-link[href$=".pdf"]');
  if (resume) resume.classList.add("nav-cta");

  /* Copy the email address. A mailto: link does nothing on a device with no
     mail client registered, so the address is copyable as a fallback. */
  var copyBtn = document.getElementById("copy-email");
  if (copyBtn) {
    var label = copyBtn.querySelector("span");
    var icon = copyBtn.querySelector("i");
    var original = label.textContent;
    copyBtn.addEventListener("click", function () {
      var email = copyBtn.dataset.email;
      var done = function (ok) {
        label.textContent = ok ? "Copied" : email;
        if (icon) icon.className = ok ? "bi bi-check2" : "bi bi-envelope";
        copyBtn.classList.add("is-copied");
        setTimeout(function () {
          label.textContent = original;
          if (icon) icon.className = "bi bi-clipboard";
          copyBtn.classList.remove("is-copied");
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(function () { done(true); }, function () { done(false); });
      } else {
        done(false);
      }
    });
  }

  /* Reveal-on-scroll */
  var targets = document.querySelectorAll(".reveal");
  if (reduce || !("IntersectionObserver" in window)) {
    targets.forEach(function (el) { el.classList.add("in"); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var el = entry.target;
        var delay = parseInt(el.dataset.delay || "0", 10);
        setTimeout(function () { el.classList.add("in"); }, delay);
        io.unobserve(el);
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
    targets.forEach(function (el) { io.observe(el); });
  }

  /* Highlight the nav item for the section in view (landing page only) */
  var sections = document.querySelectorAll("#quarto-content section[id]");
  var navLinks = Array.prototype.slice.call(document.querySelectorAll(".navbar .nav-link"));
  if (sections.length && navLinks.length && "IntersectionObserver" in window) {
    var byHash = {};
    navLinks.forEach(function (a) {
      var href = a.getAttribute("href") || "";
      var i = href.indexOf("#");
      if (i > -1) byHash[href.slice(i + 1)] = a;
    });
    var so = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var link = byHash[entry.target.id];
        if (!link) return;
        if (entry.isIntersecting) {
          navLinks.forEach(function (a) { a.classList.remove("active"); });
          link.classList.add("active");
        }
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    sections.forEach(function (s) { so.observe(s); });
  }

  /* Projects listing: filter by year */
  var bar = document.querySelector(".filter-bar");
  if (bar) {
    var chips = Array.prototype.slice.call(bar.querySelectorAll(".filter-chip"));
    var count = bar.querySelector(".filter-count");
    var empty = document.querySelector(".filter-empty");
    var apply = function () {
      var active = bar.querySelector(".filter-chip.active");
      var year = active ? active.dataset.year : "all";
      var cards = document.querySelectorAll("[data-listing-date-sort]");
      var shown = 0;
      cards.forEach(function (card) {
        var d = new Date(Number(card.dataset.listingDateSort));
        var ok = year === "all" || String(d.getFullYear()) === year;
        card.hidden = !ok;
        if (ok) shown += 1;
      });
      if (count) count.textContent = shown + (shown === 1 ? " project" : " projects");
      if (empty) empty.hidden = shown !== 0;
    };
    chips.forEach(function (chip) {
      chip.addEventListener("click", function () {
        chips.forEach(function (c) { c.classList.remove("active"); });
        chip.classList.add("active");
        apply();
      });
    });
    apply();
  }
})();
</script>
